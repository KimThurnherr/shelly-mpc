[project]
name = "shelly-mcp"
# Nur Major.Minor wird von Hand gepflegt, der Patch-Teil wird automatisch
# aus der Git-Historie gezaehlt (siehe _read_version im Paket).
version = "0.2.0"
description = "Shelly MCP Server (Licht über Shelly Cloud, BLU TRV über BLU Gateway Gen3) für Claude"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.10.0,<2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shelly_mcp"]
